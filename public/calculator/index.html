<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Graphing Calculator — Digital SAT Practice</title>
  <!-- Step 1: include Desmos secure javascript file -->
  <script src="https://www.desmos.com/api/v1.12/calculator.js?apiKey=6e5041f13f114d1681b08e3296532395"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #ffffff;
    }
    html[data-theme="dark"],
    html[data-theme="dark"] body {
      background: #161618;
      color: #f5f5f7;
    }
    #calculator {
      width: 100%;
      height: 100%;
    }
    .desmos-fallback {
      display: none;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 28px 24px;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .desmos-fallback[data-visible="true"] {
      display: flex;
    }
    .desmos-fallback-card {
      max-width: 380px;
      display: grid;
      gap: 12px;
    }
    .desmos-fallback-card h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 650;
    }
    .desmos-fallback-card p {
      margin: 0;
      font-size: 13px;
      line-height: 1.55;
      opacity: 0.78;
    }
    .desmos-fallback-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 6px;
    }
    .desmos-fallback-actions button,
    .desmos-fallback-actions a {
      font: inherit;
      font-size: 12.5px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(128, 128, 128, 0.3);
      background: transparent;
      color: inherit;
      cursor: pointer;
      text-decoration: none;
    }
    .desmos-fallback-actions button.primary {
      background: #c96442;
      border-color: #c96442;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <!-- Step 2: calculator mount element -->
  <div id="calculator"></div>

  <div id="fallback" class="desmos-fallback" role="alert">
    <div class="desmos-fallback-card">
      <h2>Desmos Graphing Calculator requires an internet connection</h2>
      <p>Unable to reach desmos.com. Check your connection and retry, or switch to the built-in offline backup calculator.</p>
      <div class="desmos-fallback-actions">
        <button type="button" class="primary" onclick="window.location.reload()">Retry Desmos</button>
        <a href="/calculator/offline.html">Use offline calculator</a>
      </div>
    </div>
  </div>

  <!-- Step 3: initialize Desmos GraphingCalculator (Digital SAT configuration) -->
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var initialDark = params.get('theme') === 'dark';
      document.documentElement.dataset.theme = initialDark ? 'dark' : 'light';

      var elt = document.getElementById('calculator');
      var fallback = document.getElementById('fallback');

      if (typeof window.Desmos === 'undefined' || !window.Desmos.GraphingCalculator) {
        if (elt) elt.style.display = 'none';
        if (fallback) fallback.setAttribute('data-visible', 'true');
        return;
      }

      var calculator = window.Desmos.GraphingCalculator(elt, {
        images: false,
        folders: false,
        notes: false,
        qwertyKeyboard: true,
        border: false,
        invertedColors: initialDark
      });

      window.addEventListener('resize', function () {
        calculator.resize();
      });

      window.addEventListener('message', function (event) {
        if (event.origin !== window.location.origin) return;
        if (event.data && event.data.type === 'redbook-graph-theme') {
          var isDark = event.data.theme === 'dark';
          document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
          calculator.updateSettings({ invertedColors: isDark });
        } else if (event.data && event.data.type === 'redbook-graph-resize') {
          calculator.resize();
        }
      });

      window.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
          window.parent.postMessage({ type: 'redbook-graph-close' }, window.location.origin);
        }
      });
    })();
  </script>
</body>
</html>
